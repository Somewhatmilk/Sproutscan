<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* BASE STYLES */
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        
        .navbar { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-logout { background: #c0392b; border: none; color: white; padding: 5px 15px; border-radius: 4px; cursor: pointer; }

        .layout { display: flex; flex: 1; overflow: hidden; }
        
        /* SIDEBAR (Cameras) */
        .sidebar { width: 250px; background: #e0e0e0; padding: 20px; border-right: 1px solid #ccc; display: flex; flex-direction: column; gap: 10px; }
        .camera-item { background: white; padding: 10px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .camera-item:hover { background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* MAIN FEED */
        .main-feed { flex: 1; background: black; position: relative; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        
        /* OVERLAY HUD */
        .hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); color: white; padding: 15px; border-radius: 8px; border-left: 5px solid #27ae60; }
        
        /* ROLE SPECIFIC PANELS */
        .control-panel { width: 300px; background: white; padding: 20px; border-left: 1px solid #ddd; overflow-y: auto; }
        
        /* FEATURE CLASSES (Hidden by default) */
        .admin-feature, .expert-feature, .farmer-feature { display: none; margin-bottom: 20px; padding: 15px; border-radius: 8px; }
        
        /* Admin Styling */
        .admin-feature { border: 1px dashed #c0392b; background: #fff5f5; }
        .btn-admin { background: #c0392b; color: white; width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }

        /* Expert Styling */
        .expert-feature { border: 1px solid #2980b9; background: #f0f8ff; }
        .btn-expert { background: #2980b9; color: white; width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; }

        /* Farmer Styling */
        .farmer-feature { background: #e8f5e9; border: 1px solid #27ae60; text-align: center; }
        .btn-action { background: #27ae60; color: white; padding: 15px; width: 100%; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }

    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div style="font-weight: bold; font-size: 20px;">
            <i class="fas fa-leaf"></i> AgriScan <span id="roleBadge" style="font-size: 12px; background: #ffffff30; padding: 2px 8px; border-radius: 10px;">LOADING...</span>
        </div>
        <div>
            <span id="userName" style="margin-right: 15px;">User</span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="layout">
        
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div style="font-size: 12px; font-weight: bold; color: #555;">CAMERAS</div>
            <div class="camera-item"><i class="fas fa-video"></i> North Field</div>
            <div class="camera-item"><i class="fas fa-video"></i> Greenhouse A</div>
            
            <!-- ADMIN ONLY: Add Camera -->
            <button id="btnAddCam" class="admin-feature btn-admin" style="background: #7f8c8d;">
                <i class="fas fa-plus"></i> Add Hardware
            </button>
        </div>

        <!-- CENTER: LIVE VIDEO -->
        <div class="main-feed">
            <video id="liveVideo" autoplay muted playsinline></video>
            <div class="hud">
                <div style="font-size: 12px; color: #ccc;">REALTIME ANALYSIS</div>
                <div id="statusText" style="font-size: 24px; font-weight: bold;">SCANNING...</div>
                <div id="confText">Confidence: --%</div>
            </div>
        </div>

        <!-- RIGHT: ROLE SPECIFIC CONTROLS -->
        <div class="control-panel">
            
            <!-- 1. FARMER JOHN PANEL (Simple Actions) -->
            <div id="farmerPanel" class="farmer-feature">
                <h3><i class="fas fa-clipboard-check"></i> Field Actions</h3>
                <p>If analysis confirms disease:</p>
                <button class="btn-action" onclick="alert('Task Logged: Sprayed Fungicide')">
                    MARK TREATED
                </button>
                <button class="btn-action" style="margin-top: 10px; background: #f39c12;" onclick="alert('Alert Acknowledged')">
                    ACKNOWLEDGE ALERT
                </button>
            </div>

            <!-- 2. EXPERT JANE PANEL (Data & Reports) -->
            <div id="expertPanel" class="expert-feature">
                <h3><i class="fas fa-chart-line"></i> Agronomist Tools</h3>
                <canvas id="spectralChart" height="150"></canvas>
                <div style="margin-top: 10px; font-size: 12px;">Spectral Variance (IR/UV)</div>
                <br>
                <button class="btn-expert" onclick="alert('PDF Report Generating...')">
                    <i class="fas fa-file-download"></i> Download Audit Report
                </button>
                <button class="btn-expert" style="margin-top: 5px; background: #e67e22;" onclick="alert('Feedback Sent to AI Model')">
                    <i class="fas fa-flag"></i> Flag False Positive
                </button>
            </div>

            <!-- 3. ADMIN PANEL (System Settings) -->
            <div id="adminPanel" class="admin-feature">
                <h3><i class="fas fa-cogs"></i> System Admin</h3>
                <div style="font-size: 12px; color: #555; margin-bottom: 5px;">Server Load: 12%</div>
                <button class="btn-admin" onclick="alert('Rebooting AI Core...')">
                    <i class="fas fa-power-off"></i> Reboot AI Server
                </button>
                <button class="btn-admin" onclick="alert('Logs Exported')">
                    <i class="fas fa-terminal"></i> View System Logs
                </button>
                <button class="btn-admin" style="background: #27ae60;" onclick="alert('User Created')">
                    <i class="fas fa-user-plus"></i> Add User Profile
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- 1. INITIALIZATION ---
        window.onload = function() {
            // Check Identity
            const role = localStorage.getItem('agriUserRole');
            const name = localStorage.getItem('agriUserName');

            if(!role) {
                window.location.href = '/'; // Kick back to login
                return;
            }

            // Set UI Text
            document.getElementById('userName').innerText = name;
            document.getElementById('roleBadge').innerText = role.toUpperCase();

            // APPLY PERMISSIONS (The Core Logic)
            if(role === 'admin') {
                show('.admin-feature');
                // Admins also see expert tools usually, but let's keep it separate for clarity
            } 
            else if (role === 'expert') {
                show('.expert-feature');
                initExpertChart(); // Only load heavy charts for expert
            } 
            else if (role === 'farmer') {
                show('.farmer-feature');
            }

            startCamera();
            setInterval(updateLiveFeed, 1000);
        };

        // Helper to show elements
        function show(selector) {
            document.querySelectorAll(selector).forEach(el => el.style.display = 'block');
        }

        // --- 2. CAMERA & AI MOCK ---
        function startCamera() {
            if(navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                .then(s => document.getElementById('liveVideo').srcObject = s)
                .catch(e => console.log("No cam"));
            }
        }

        async function updateLiveFeed() {
            const res = await fetch('/api/live-data');
            const data = await res.json();
            
            document.getElementById('statusText').innerText = data.status.toUpperCase();
            const pct = Math.round(data.confidence * 100);
            document.getElementById('confText').innerText = `Confidence: ${pct}%`;
            
            // Color Logic
            const hud = document.querySelector('.hud');
            if(data.status === 'Healthy') hud.style.borderLeftColor = '#27ae60'; // Green
            else hud.style.borderLeftColor = '#c0392b'; // Red
        }

        // --- 3. EXPERT CHART (Only draws if Jane logs in) ---
        function initExpertChart() {
            const ctx = document.getElementById('spectralChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['400nm', '500nm', '600nm', '700nm', '800nm'],
                    datasets: [{
                        label: 'Leaf Reflectance',
                        data: [10, 25, 40, 30, 80], // Typical healthy vegetation curve
                        borderColor: '#2980b9',
                        borderWidth: 2,
                        fill: false
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
